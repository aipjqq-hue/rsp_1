<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 가위바위보 손 모양 인식기</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelBg: '#F3F4F6',
                        pastelCard: '#FFFFFF',
                        pastelAccent: '#6EE7B7',
                        pastelPrimary: '#60A5FA',
                        pastelPurple: '#C084FC'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #EFF6FF 0%, #F3E8FF 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8 text-gray-800">

    <!-- Header -->
    <header class="w-full max-w-4xl text-center mb-6">
        <h1 class="text-3xl md:text-5xl font-extrabold text-indigo-600 tracking-tight mb-2">
            ✊✌🖐 AI 가위바위보 인식기
        </h1>
        <p class="text-lg md:text-xl text-gray-600">
            실시간 웹캠이나 사진 업로드로 손 모양을 분석합니다!
        </p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-5xl bg-white/80 backdrop-blur-md rounded-3xl shadow-xl p-4 md:p-8 flex flex-col lg:flex-row gap-6">

        <!-- Left Column: Camera / Image Display Area -->
        <section class="flex-1 flex flex-col items-center">
            <div class="relative w-full aspect-video bg-gray-900 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center border-4 border-white">
                <!-- Live Video Stream -->
                <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100 hidden"></video>
                
                <!-- Image Preview (fallback) -->
                <img id="imagePreview" class="w-full h-full object-contain hidden" alt="업로드 이미지" />

                <!-- Placeholder Screen when inactive -->
                <div id="videoPlaceholder" class="flex flex-col items-center justify-center text-gray-400 p-6 text-center">
                    <svg class="w-16 h-16 mb-2 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <p class="text-lg font-medium">카메라를 시작하거나 사진을 업로드해 주세요.</p>
                </div>

                <!-- Hidden Canvas for frame capturing -->
                <canvas id="captureCanvas" class="hidden"></canvas>
            </div>

            <!-- Controls Panel -->
            <div class="w-full mt-6 grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button id="btnStartCam" class="w-full py-3 px-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold rounded-xl shadow-md transition duration-200 text-base md:text-lg flex items-center justify-center gap-2">
                    📷 카메라 시작
                </button>
                <button id="btnStartRecognize" disabled class="w-full py-3 px-4 bg-blue-500 hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed active:scale-95 text-white font-bold rounded-xl shadow-md transition duration-200 text-base md:text-lg flex items-center justify-center gap-2">
                    ▶ 인식 시작
                </button>
                <button id="btnStopRecognize" disabled class="w-full py-3 px-4 bg-amber-500 hover:bg-amber-600 disabled:bg-gray-300 disabled:cursor-not-allowed active:scale-95 text-white font-bold rounded-xl shadow-md transition duration-200 text-base md:text-lg flex items-center justify-center gap-2">
                    ⏸ 인식 중지
                </button>
                <button id="btnStopCam" disabled class="w-full py-3 px-4 bg-rose-500 hover:bg-rose-600 disabled:bg-gray-300 disabled:cursor-not-allowed active:scale-95 text-white font-bold rounded-xl shadow-md transition duration-200 text-base md:text-lg flex items-center justify-center gap-2">
                    ⏹ 카메라 종료
                </button>
            </div>

            <!-- Photo Upload Alternative -->
            <div class="w-full mt-4 p-4 bg-indigo-50/60 rounded-xl border border-indigo-100 flex flex-col sm:flex-row items-center justify-between gap-3">
                <span class="text-sm md:text-base text-indigo-900 font-medium">카메라를 사용할 수 없나요?</span>
                <label class="cursor-pointer py-2 px-5 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg shadow transition duration-200 text-sm md:text-base">
                    📁 사진 선택 및 분석
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                </label>
            </div>
        </section>

        <!-- Right Column: Recognition Result Screen -->
        <section class="w-full lg:w-80 flex flex-col gap-4">
            <div class="bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100 rounded-2xl p-6 shadow-sm flex flex-col items-center justify-center flex-1 min-h-[250px]">
                <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2">실시간 인식 결과</span>
                
                <!-- Hand Shape Display Emoji -->
                <div id="gestureEmoji" class="text-7xl md:text-8xl my-3 transition-transform duration-300 hover:scale-110">
                    ❓
                </div>

                <!-- Class Name -->
                <div id="gestureLabel" class="text-2xl md:text-3xl font-extrabold text-gray-700 tracking-wide mb-1">
                    대기 중...
                </div>

                <!-- Confidence Score -->
                <div id="confidenceBarContainer" class="w-full mt-4 hidden">
                    <div class="flex justify-between text-sm font-semibold text-gray-600 mb-1">
                        <span>신뢰도 (Confidence)</span>
                        <span id="confidenceText">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                        <div id="confidenceBar" class="bg-indigo-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Toast / Status Message Area -->
            <div id="statusCard" class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm md:text-base text-blue-800 flex items-center gap-3 shadow-sm">
                <span id="statusIcon" class="text-xl">ℹ️</span>
                <span id="statusMessage">카메라 시작 버튼을 눌러 손 모양 인식을 시작하세요.</span>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs md:text-sm text-gray-500">
        Roboflow ViT(Base) 모델 & Serverless API 기반 • 안전한 API Key 처리
    </footer>

    <!-- Client-side Logic Script -->
    <script>
        // DOM Elements
        const webcam = document.getElementById('webcam');
        const imagePreview = document.getElementById('imagePreview');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const captureCanvas = document.getElementById('captureCanvas');
        
        const btnStartCam = document.getElementById('btnStartCam');
        const btnStartRecognize = document.getElementById('btnStartRecognize');
        const btnStopRecognize = document.getElementById('btnStopRecognize');
        const btnStopCam = document.getElementById('btnStopCam');
        const fileInput = document.getElementById('fileInput');

        const gestureEmoji = document.getElementById('gestureEmoji');
        const gestureLabel = document.getElementById('gestureLabel');
        const confidenceBarContainer = document.getElementById('confidenceBarContainer');
        const confidenceBar = document.getElementById('confidenceBar');
        const confidenceText = document.getElementById('confidenceText');

        const statusCard = document.getElementById('statusCard');
        const statusIcon = document.getElementById('statusIcon');
        const statusMessage = document.getElementById('statusMessage');

        // State Variables
        let stream = null;
        let isRecognizing = false;
        let recognitionInterval = null;
        let isProcessingRequest = false;

        // Class to Emoji & Label Mapping
        const GESTURE_MAP = {
            'rock': { emoji: '✊', label: '바위' },
            'paper': { emoji: '🖐', label: '보' },
            'scissors': { emoji: '✌', label: '가위' }
        };

        // UI Message Helper
        function updateStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusCard.className = "rounded-xl p-4 text-sm md:text-base flex items-center gap-3 shadow-sm border transition-all duration-200 ";
            
            if (type === 'error') {
                statusCard.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-800');
                statusIcon.textContent = '❌';
            } else if (type === 'warning') {
                statusCard.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-800');
                statusIcon.textContent = '⚠️';
            } else if (type === 'success') {
                statusCard.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
                statusIcon.textContent = '✅';
            } else {
                statusCard.classList.add('bg-blue-50', 'border-blue-200', 'text-blue-800');
                statusIcon.textContent = 'ℹ️';
            }
        }

        // Camera Control Functions
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
                });
                webcam.srcObject = stream;
                
                webcam.classList.remove('hidden');
                imagePreview.classList.add('hidden');
                videoPlaceholder.classList.add('hidden');

                btnStartCam.disabled = true;
                btnStopCam.disabled = false;
                btnStartRecognize.disabled = false;

                updateStatus('카메라가 활성화되었습니다. [인식 시작] 버튼을 눌러주세요.', 'success');
            } catch (err) {
                console.error("Camera access error:", err);
                updateStatus('카메라 접근 권한이 거부되었거나 사용 가능한 카메라가 없습니다.', 'error');
            }
        }

        function stopCamera() {
            stopRecognition();
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            webcam.srcObject = null;
            webcam.classList.add('hidden');
            videoPlaceholder.classList.remove('hidden');

            btnStartCam.disabled = false;
            btnStopCam.disabled = true;
            btnStartRecognize.disabled = true;

            updateStatus('카메라가 종료되었습니다.', 'info');
        }

        // Frame Capture & API Request
        async function captureAndPredict() {
            if (isProcessingRequest) return; // Prevent duplicate requests if previous is pending

            isProcessingRequest = true;

            try {
                let base64Image = '';

                if (stream && !webcam.classList.contains('hidden')) {
                    // Capture frame from webcam
                    const ctx = captureCanvas.getContext('2d');
                    captureCanvas.width = webcam.videoWidth || 640;
                    captureCanvas.height = webcam.videoHeight || 480;
                    ctx.drawImage(webcam, 0, 0, captureCanvas.width, captureCanvas.height);
                    base64Image = captureCanvas.toDataURL('image/jpeg', 0.8);
                } else if (!imagePreview.classList.contains('hidden') && imagePreview.src) {
                    // Use loaded image preview
                    base64Image = imagePreview.src;
                } else {
                    isProcessingRequest = false;
                    return;
                }

                // Send request to serverless endpoint
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || `서버 오류 (${response.status})`);
                }

                const result = await response.json();
                displayResult(result);

            } catch (err) {
                console.error("Inference Error:", err);
                updateStatus(`인식 중 오류 발생: ${err.message}`, 'error');
            } finally {
                isProcessingRequest = false;
            }
        }

        // Display Inference Result
        function displayResult(result) {
            if (!result || !result.class) {
                gestureEmoji.textContent = '❓';
                gestureLabel.textContent = '인식 불가';
                confidenceBarContainer.classList.add('hidden');
                return;
            }

            const className = String(result.class).toLowerCase();
            const confidencePercent = Math.round((result.confidence || 0) * 100);

            if (GESTURE_MAP[className]) {
                gestureEmoji.textContent = GESTURE_MAP[className].emoji;
                gestureLabel.textContent = GESTURE_MAP[className].label;
            } else {
                gestureEmoji.textContent = '✋';
                gestureLabel.textContent = result.class;
            }

            confidenceBarContainer.classList.remove('hidden');
            confidenceBar.style.width = `${confidencePercent}%`;
            confidenceText.textContent = `${confidencePercent}%`;
        }

        // Start/Stop Loop Recognition
        function startRecognition() {
            if (isRecognizing) return;
            isRecognizing = true;

            btnStartRecognize.disabled = true;
            btnStopRecognize.disabled = false;

            updateStatus('실시간 손 모양 인식을 시작합니다 (약 1초 간격)...', 'info');
            
            // Initial call
            captureAndPredict();
            // Loop call with interval guard
            recognitionInterval = setInterval(captureAndPredict, 1000);
        }

        function stopRecognition() {
            if (!isRecognizing) return;
            isRecognizing = false;

            if (recognitionInterval) {
                clearInterval(recognitionInterval);
                recognitionInterval = null;
            }

            btnStartRecognize.disabled = !stream;
            btnStopRecognize.disabled = true;

            updateStatus('인식이 중지되었습니다.', 'warning');
        }

        // Photo Upload Handling
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                updateStatus('이미지 용량이 너무 큽니다. 5MB 이하의 사진을 선택하세요.', 'error');
                return;
            }

            stopCamera();

            const reader = new FileReader();
            reader.onload = (event) => {
                imagePreview.src = event.target.result;
                imagePreview.classList.remove('hidden');
                videoPlaceholder.classList.add('hidden');
                webcam.classList.add('hidden');

                updateStatus('업로드된 이미지를 분석하는 중입니다...', 'info');
                captureAndPredict();
            };
            reader.readAsDataURL(file);
        });

        // Event Listeners
        btnStartCam.addEventListener('click', startCamera);
        btnStopCam.addEventListener('click', stopCamera);
        btnStartRecognize.addEventListener('click', startRecognition);
        btnStopRecognize.addEventListener('click', stopRecognition);
    </script>
</body>
</html>

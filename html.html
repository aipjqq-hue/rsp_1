<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 가위바위보 손 모양 인식기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-purple-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-3xl p-6 md:p-8 w-full max-w-5xl flex flex-col md:flex-row gap-6 items-center">
        
        <!-- 왼쪽: 웹캠 및 업로드 영역 -->
        <div class="flex-1 w-full flex flex-col items-center">
            <div class="relative w-full aspect-video bg-slate-900 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center">
                <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <canvas id="canvas" class="hidden"></canvas>
                <div id="placeholder" class="absolute text-white text-lg font-semibold flex flex-col items-center">
                    <span>📷 카메라를 시작해 주세요</span>
                </div>
            </div>

            <!-- 컨트롤 버튼 -->
            <div class="flex flex-wrap gap-3 mt-4 w-full justify-center">
                <button id="startCamBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-5 py-3 rounded-xl shadow transition flex items-center gap-2">📷 카메라 시작</button>
                <button id="startRecBtn" disabled class="bg-slate-300 text-slate-500 font-bold px-5 py-3 rounded-xl shadow transition flex items-center gap-2 cursor-not-allowed">▶ 인식 시작</button>
                <button id="stopRecBtn" disabled class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-5 py-3 rounded-xl shadow transition flex items-center gap-2 cursor-not-allowed">⏸ 인식 중지</button>
                <button id="stopCamBtn" disabled class="bg-rose-500 hover:bg-rose-600 text-white font-bold px-5 py-3 rounded-xl shadow transition flex items-center gap-2 cursor-not-allowed">⏹ 카메라 종료</button>
            </div>

            <!-- 사진 업로드 대체 옵션 -->
            <div class="mt-4 w-full flex flex-col sm:flex-row items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200 gap-2">
                <span class="text-sm text-slate-600 font-medium">카메라를 사용할 수 없나요?</span>
                <label class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2 rounded-lg cursor-pointer shadow transition">
                    📁 사진 선택 및 분석
                    <input type="file" id="imageUpload" accept="image/*" class="hidden">
                </label>
            </div>
        </div>

        <!-- 오른쪽: 인식 결과 출력 카드 -->
        <div class="w-full md:w-80 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-6 flex flex-col items-center justify-center min-h-[320px] shadow-sm">
            <span class="text-xs font-bold text-indigo-400 tracking-wider mb-4">실시간 인식 결과</span>
            
            <div id="resultIcon" class="text-7xl mb-3 animate-bounce">❓</div>
            <div id="resultClass" class="text-2xl font-extrabold text-slate-800 mb-1">대기 중...</div>
            <div id="resultConfidence" class="text-sm font-semibold text-slate-500 mb-4">신뢰도: -</div>
            
            <div id="statusMessage" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-xs text-slate-600 text-center shadow-sm">
                준비 완료
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const placeholder = document.getElementById('placeholder');
        
        const startCamBtn = document.getElementById('startCamBtn');
        const startRecBtn = document.getElementById('startRecBtn');
        const stopRecBtn = document.getElementById('stopRecBtn');
        const stopCamBtn = document.getElementById('stopCamBtn');
        const imageUpload = document.getElementById('imageUpload');

        const resultIcon = document.getElementById('resultIcon');
        const resultClass = document.getElementById('resultClass');
        const resultConfidence = document.getElementById('resultConfidence');
        const statusMessage = document.getElementById('statusMessage');

        let stream = null;
        let isRecognizing = false;
        let recognitionInterval = null;
        let isProcessing = false;

        const classMap = {
            'rock': { name: '바위 (Rock)', emoji: '✊' },
            'paper': { name: '보 (Paper)', emoji: '🖐' },
            'scissors': { name: '가위 (Scissors)', emoji: '✌' }
        };

        // 카메라 시작
        startCamBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                placeholder.style.display = 'none';
                
                startCamBtn.disabled = true;
                startCamBtn.classList.replace('bg-emerald-500', 'bg-slate-300');
                startCamBtn.classList.remove('hover:bg-emerald-600', 'text-white', 'cursor-pointer');
                startCamBtn.classList.add('text-slate-500', 'cursor-not-allowed');

                startRecBtn.disabled = false;
                startRecBtn.classList.replace('bg-slate-300', 'bg-indigo-500');
                startRecBtn.classList.remove('text-slate-500', 'cursor-not-allowed');
                startRecBtn.classList.add('hover:bg-indigo-600', 'text-white', 'cursor-pointer');

                stopCamBtn.disabled = false;
                stopCamBtn.classList.replace('bg-slate-300', 'bg-rose-500');
                stopCamBtn.classList.remove('text-slate-500', 'cursor-not-allowed');
                stopCamBtn.classList.add('hover:bg-rose-600', 'text-white', 'cursor-pointer');

                statusMessage.textContent = '카메라가 켜졌습니다. [인식 시작]을 눌러주세요.';
            } catch (err) {
                alert('카메라 권한을 허용해 주세요.');
                statusMessage.textContent = '카메라 권한 오류 발생';
            }
        });

        // 카메라 종료
        stopCamBtn.addEventListener('click', () => {
            stopRecognition();
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                placeholder.style.display = 'flex';
            }
            startCamBtn.disabled = false;
            startCamBtn.classList.replace('bg-slate-300', 'bg-emerald-500');
            startCamBtn.classList.add('hover:bg-emerald-600', 'text-white', 'cursor-pointer');
            startCamBtn.classList.remove('text-slate-500', 'cursor-not-allowed');

            startRecBtn.disabled = true;
            startRecBtn.classList.replace('bg-indigo-500', 'bg-slate-300');
            startRecBtn.classList.remove('hover:bg-indigo-600', 'text-white', 'cursor-pointer');
            startRecBtn.classList.add('text-slate-500', 'cursor-not-allowed');

            stopCamBtn.disabled = true;
            stopCamBtn.classList.replace('bg-rose-500', 'bg-slate-300');
            stopCamBtn.classList.remove('hover:bg-rose-600', 'text-white', 'cursor-pointer');
            stopCamBtn.classList.add('text-slate-500', 'cursor-not-allowed');

            statusMessage.textContent = '카메라가 종료되었습니다.';
        });

        // 인식 시작
        startRecBtn.addEventListener('click', () => {
            isRecognizing = true;
            startRecBtn.disabled = true;
            startRecBtn.classList.replace('bg-indigo-500', 'bg-slate-300');
            stopRecBtn.disabled = false;
            stopRecBtn.classList.replace('bg-slate-300', 'bg-amber-500');
            stopRecBtn.classList.remove('text-slate-500', 'cursor-not-allowed');
            stopRecBtn.classList.add('hover:bg-amber-600', 'text-white', 'cursor-pointer');

            statusMessage.textContent = '실시간 인식 중...';

            recognitionInterval = setInterval(() => {
                if (!isRecognizing || isProcessing) return;
                captureAndSend();
            }, 1000);
        });

        // 인식 중지
        function stopRecognition() {
            isRecognizing = false;
            clearInterval(recognitionInterval);
            if (startCamBtn.disabled && !video.srcObject) return;
            startRecBtn.disabled = false;
            startRecBtn.classList.replace('bg-slate-300', 'bg-indigo-500');
            startRecBtn.classList.add('hover:bg-indigo-600', 'text-white', 'cursor-pointer');
            stopRecBtn.disabled = true;
            stopRecBtn.classList.replace('bg-amber-500', 'bg-slate-300');
            stopRecBtn.classList.add('text-slate-500', 'cursor-not-allowed');
            statusMessage.textContent = '인식이 중지되었습니다.';
        }
        stopRecBtn.addEventListener('click', stopRecognition);

        // 프레임 캡처 및 API 전송
        async function captureAndSend() {
            if (!video.videoWidth) return;
            isProcessing = true;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64Data = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
            await sendToServer(base64Data);
            isProcessing = false;
        }

        // 사진 업로드 분석
        imageUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(uploadEvent) {
                const base64Data = uploadEvent.target.result.split(',')[1];
                statusMessage.textContent = '업로드한 사진 분석 중...';
                await sendToServer(base64Data);
            };
            reader.readAsDataURL(file);
        });

        // 서버로 요청 공통 함수
        async function sendToServer(base64Image) {
            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('서버 오류 (404): Vercel 배포 주소로 접속 중인지 확인하세요.');
                    }
                    throw new Error(data.error || `서버 오류 (${response.status})`);
                }

                parseAndDisplayResult(data);
            } catch (err) {
                console.error(err);
                statusMessage.innerHTML = `<span class="text-rose-500 font-bold">오류: ${err.message}</span>`;
            }
        }

        // 결과 파싱 및 화면 반영
        function parseAndDisplayResult(data) {
            try {
                let prediction = null;

                // Workflow 응답 구조 처리
                if (data.outputs && data.outputs[0]) {
                    const out = data.outputs[0];
                    if (out.predictions && out.predictions.top) {
                        prediction = {
                            class: out.predictions.top,
                            confidence: out.predictions.confidence || 1.0
                        };
                    } else if (out.predicted_classes && out.predicted_classes.length > 0) {
                        prediction = {
                            class: out.predicted_classes[0],
                            confidence: 1.0
                        };
                    } else if (out.class) {
                        prediction = {
                            class: out.class,
                            confidence: out.confidence || 1.0
                        };
                    }
                } else if (data.predictions) {
                    const keys = Object.keys(data.predictions);
                    if (keys.length > 0) {
                        prediction = {
                            class: keys[0],
                            confidence: data.predictions[keys[0]].confidence || 1.0
                        };
                    }
                }

                if (prediction && classMap[prediction.class.toLowerCase()]) {
                    const info = classMap[prediction.class.toLowerCase()];
                    const confPercent = (prediction.confidence * 100).toFixed(1);
                    resultIcon.textContent = info.emoji;
                    resultClass.textContent = info.name;
                    resultConfidence.textContent = `신뢰도: ${confPercent}%`;
                    statusMessage.textContent = '정상적으로 인식되었습니다.';
                } else {
                    resultIcon.textContent = '❓';
                    resultClass.textContent = '인식 실패';
                    resultConfidence.textContent = '신뢰도: -';
                    statusMessage.textContent = '손 모양을 명확히 보여주세요.';
                }
            } catch (e) {
                console.error('Parsing error:', e);
                statusMessage.textContent = '결과 데이터를 해석하는 중 오류가 발생했습니다.';
            }
        }
    </script>
</body>
</html>
